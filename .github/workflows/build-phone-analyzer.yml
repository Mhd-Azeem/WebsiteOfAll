name: AZ Phone Analyzer APK
on:
  workflow_dispatch:
  push:
    branches: [feature/az-phone-analyzer]
    paths:
      - 'android/AZPhoneAnalyzer/**'
      - '.github/workflows/build-phone-analyzer.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/AZPhoneAnalyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || test ${PIPESTATUS[1]} -eq 0
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AZPhoneAnalyzer-debug-apk
          path: android/AZPhoneAnalyzer/app/build/outputs/apk/debug/*.apk
